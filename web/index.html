<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15171a;touch-action:none}
#viewport{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:fixed;left:10px;bottom:10px;padding:6px 9px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;font:12px monospace;z-index:20}
</style></head><body><div id="viewport"></div><div id="status">ASTEAMING viewport starting...</div>
<script type="importmap">{"imports":{"three":"./libs/three/build/three.module.js","three/addons/":"./libs/three/examples/jsm/","three-viewport-gizmo":"./libs/three-viewport-gizmo/dist/three-viewport-gizmo.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {ViewportGizmo} from 'three-viewport-gizmo';

const host=document.getElementById('viewport'),status=document.getElementById('status');
function showError(e){status.textContent='Viewport error: '+(e?.message||e);status.style.background='rgba(120,0,0,.8)';console.error(e)}
try{
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x15171a);
const camera=new THREE.PerspectiveCamera(50,1,.01,2000); camera.position.set(5,4,7);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75)); renderer.outputColorSpace=THREE.SRGBColorSpace; host.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08; controls.enablePan=true; controls.screenSpacePanning=true;
controls.rotateSpeed=.72; controls.panSpeed=.8; controls.zoomSpeed=.9; controls.minDistance=.5; controls.maxDistance=100;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN}; controls.target.set(0,1,0); controls.update();

const grid=new THREE.GridHelper(20,40,0x69747e,0x30363d); grid.position.y=0; scene.add(grid);
const axes=new THREE.AxesHelper(2); scene.add(axes);
scene.add(new THREE.HemisphereLight(0xffffff,0x30343a,2.1));
const key=new THREE.DirectionalLight(0xffffff,2.5); key.position.set(4,7,5); scene.add(key);
const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.2,1.1),new THREE.MeshStandardMaterial({color:0x70808d,roughness:.72}));
body.position.y=1.1; scene.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.72,24,16),new THREE.MeshStandardMaterial({color:0x9aa6b0,roughness:.68}));
head.position.y=2.65; scene.add(head);

let gizmo=null;
try{
gizmo=new ViewportGizmo(camera,renderer,{type:'sphere',size:128,placement:'top-right',offset:{top:12,right:12},animated:true,speed:1.4,lineWidth:2});
gizmo.attachControls(controls);
gizmo.target.copy(controls.target);
gizmo.update();
}catch(e){showError('Gizmo failed: '+(e?.message||e));}

function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(gizmo)gizmo.update();}
new ResizeObserver(resize).observe(host); resize();
function frame(){controls.update();if(gizmo)gizmo.target.copy(controls.target);renderer.render(scene,camera);if(gizmo)gizmo.render();requestAnimationFrame(frame)}
status.textContent=gizmo?'Viewport ready • drag to orbit • pinch to zoom':'Viewport ready • gizmo unavailable';
setTimeout(()=>{if(status.textContent.startsWith('Viewport ready'))status.style.display='none'},2500);
requestAnimationFrame(frame);
}catch(e){showError(e)}
</script></body></html>
